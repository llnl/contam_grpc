syntax = "proto3";

package contam.params;

import "contam_ambience.proto";

message Sim_Params {
  message Contam_Params {
    string prj_filename = 1; ///< Contam project filename
    repeated contam.ambience.Contam_Ambience ambiences = 2; ///< Set of ambience timeseries
  }

  message Client_Params {
    bool of_out = 1; ///< Whether to write stdout from Contam server into a file
    bool of_err = 2; ///< Whether to write stderr from Contam server into a file
    bool of_ach = 3; ///< Whether to retrieve .ach output file from Contam server
    bool of_cex = 4; ///< Whether to retrieve .cex output file from Contam server
    bool of_csm = 5; ///< Whether to retrieve .csm output file from Contam server
    bool of_log = 6; ///< Whether to retrieve .log output file from Contam server
    bool of_rst = 7; ///< Whether to retrieve .rst output file from Contam server
    bool of_sim = 8; ///< Whether to retrieve .sim output file from Contam server
    bool of_xlog = 9; ///< Whether to retrieve .xlog output file from Contam server
    string of_prefix = 10; ///< prefix path to the contam output files
  }

  Contam_Params contam_params = 1;
  Client_Params client_params = 2;
}
